services:
  - type: web
    name: script-kiddie-api
    runtime: docker
    rootDir: script-kiddie
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: CLIENT_URL
        value: https://script-kiddie-client.onrender.com
      - key: COOKIE_DOMAIN
        value: ""
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_APP_PASSWORD
        sync: false

  - type: web
    name: script-kiddie-client
    runtime: docker
    rootDir: script-kiddie
    dockerfilePath: ./client/Dockerfile
    dockerContext: ./client
    plan: free
    envVars:
      - key: BACKEND_ORIGIN
        value: https://script-kiddie-api.onrender.com
